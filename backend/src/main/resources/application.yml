spring:
  application:
    name: savix-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

server:
  port: ${SERVER_PORT}

app:
  frontend:
    url: ${FRONTEND_URL}
  proxy:
    secret: ${PROXY_SECRET}
  email:
    from: ${EMAIL_FROM}
    from-name: ${EMAIL_FROM_NAME}

auth:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    clock-skew-seconds: 30
    public-key-location: ${JWT_PUBLIC_KEY}
    private-key-location: ${JWT_PRIVATE_KEY}

  access-token:
    ttl-seconds: 600 # 10 minutes
    cookie-name: access_token

  refresh-token:
    ttl-seconds: 1209600 # 14 days
    cookie-name: refresh_token

  reset-token:
    ttl-seconds: 900 # 15 minutes

  cookie:
    secure: true
    domain: ${COOKIE_DOMAIN:}

  password:
    min-length: 12
    require-categories: 3

  rate-limit:
    max-attempts: 5
    window-seconds: 900 # 15 minutes
    lockout-seconds: 900 # 15 minutes
    refresh:
      max-attempts: 30
      window-seconds: 60 # 30 refreshes per minute is generous for normal usage

logging:
  level:
    com.mikeshaggy.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
