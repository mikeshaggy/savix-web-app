spring:
  flyway:
    enabled: false
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none
  application:
    name: savix-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/savix}
    username: ${DB_USERNAME:savix-admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  mail:
    host: ${MAIL_HOST:${SMTP_HOST:smtp-relay.brevo.com}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

server:
  port: ${SERVER_PORT:8000}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  proxy:
    secret: ${PROXY_SECRET:development-secret-key-change-me}
  email:
    from: ${EMAIL_FROM:savix@mikeshaggy.com}
    from-name: ${EMAIL_FROM_NAME:Savix}

auth:
  jwt:
    issuer: ${JWT_ISSUER:savix-backend}
    audience: ${JWT_AUDIENCE:savix-frontend}
    clock-skew-seconds: 30
    public-key-location: ${JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY_PATH:classpath:jwt-public-key.pem}}
    private-key-location: ${JWT_PRIVATE_KEY:${JWT_PRIVATE_KEY_PATH:classpath:jwt-private-key.pem}}

  access-token:
    ttl-seconds: 600 # 10 minutes
    cookie-name: access_token

  refresh-token:
    ttl-seconds: 1209600 # 14 days
    cookie-name: refresh_token

  reset-token:
    ttl-seconds: 900 # 15 minutes

  cookie:
    secure: true
    domain: ${COOKIE_DOMAIN:}

  password:
    min-length: 12
    require-categories: 3

  rate-limit:
    max-attempts: 5
    window-seconds: 900 # 15 minutes
    lockout-seconds: 900 # 15 minutes
    refresh:
      max-attempts: 30
      window-seconds: 60 # 30 refreshes per minute is generous for normal usage

logging:
  level:
    com.mikeshaggy.backend: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
