# ──────────────────────────────────────────────────────────────────────────────
# PRODUCTION CONFIG (Raspberry Pi deployment).
#
# Activated with spring.profiles.active=prod. All secrets are supplied via
# environment variables and read-only JWT files. Database, mail credentials, frontend URL, and proxy
# secret have no development fallback in this profile.
# ──────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:${SMTP_HOST:smtp-relay.brevo.com}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD}}

app:
  frontend:
    url: ${FRONTEND_URL}
  proxy:
    secret: ${PROXY_SECRET}

auth:
  jwt:
    # No classpath fallback in production. Both aliases accept file: resource URIs.
    public-key-location: ${JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY_PATH:}}
    private-key-location: ${JWT_PRIVATE_KEY:${JWT_PRIVATE_KEY_PATH:}}

logging:
  level:
    com.mikeshaggy.backend: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
